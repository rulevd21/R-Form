<style>
/* R/Form Channel Control UX v0.3 */
.tg-segment{margin-bottom:12px}.tg-segment:last-child{margin-bottom:0}.tg-segment-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px 3px}
.cc3-review{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cc3-review-state{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:750;letter-spacing:.04em}
.cc3-review-state.VERIFIED,.cc3-review-state.LOCKED{color:#bde2ca;border-color:rgba(128,184,154,.42);background:rgba(128,184,154,.07)}
.cc3-review-state.RECHECK_REQUIRED{color:#efc893;border-color:rgba(216,173,100,.45);background:rgba(216,173,100,.07)}
.cc3-review-state.NOT_REVIEWED{color:#bfd7e0;border-color:rgba(138,174,190,.38)}
.cc3-next{background:linear-gradient(135deg,rgba(198,161,91,.08),rgba(138,174,190,.04));border:1px solid rgba(198,161,91,.28);border-radius:18px;padding:16px;margin:0 0 18px}
.cc3-next-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}.cc3-next-label{font-size:10px;color:var(--brass);text-transform:uppercase;letter-spacing:.12em}.cc3-next-title{font-size:19px;font-weight:760;margin:5px 0}.cc3-next-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px}.cc3-next-ready{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:7px;margin-top:12px}.cc3-next-ready div{background:rgba(8,11,15,.55);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:8px}.cc3-next-ready small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.cc3-next-ready b{display:block;margin-top:3px;font-size:11px}.cc3-next-blocker{margin-top:10px;color:#e4c995;font-size:11px}.cc3-next-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.cc3-diff{display:none;margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.cc3-diff.show{display:block}.cc3-diff-head{padding:9px 11px;background:#0d1115;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.cc3-diff-meta,.cc3-diff-cols{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}.cc3-diff-meta>div,.cc3-diff-col{background:#0b1014;padding:10px 11px}.cc3-diff-col{min-height:130px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5}.cc3-diff-col h4{margin:0 0 8px;color:var(--muted);font-size:10px}.cc3-del{background:rgba(200,120,120,.2);text-decoration:line-through}.cc3-add{background:rgba(128,184,154,.2)}
.cc3-gallery{margin-bottom:10px}.cc3-main{position:relative}.cc3-main .preview-media{max-width:780px;margin:auto}.cc3-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(8,11,15,.8);color:var(--text);font-size:22px;cursor:pointer}.cc3-arrow.prev{left:12px}.cc3-arrow.next{right:12px}.cc3-thumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px}.cc3-thumb{flex:0 0 88px;height:112px;padding:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#080b0f;cursor:pointer;opacity:.62}.cc3-thumb.active{opacity:1;border-color:rgba(198,161,91,.75)}.cc3-thumb img{width:100%;height:100%;object-fit:cover}.cc3-pair{display:grid;grid-template-columns:repeat(2,minmax(300px,1fr));gap:12px;margin-bottom:10px}.cc3-single .preview-media{max-width:720px;margin:auto}.cc3-counter{position:absolute;right:14px;top:12px;padding:5px 8px;border-radius:999px;background:rgba(8,11,15,.78);font-size:11px}
@media(max-width:1180px){.cc3-next-grid{grid-template-columns:1fr}.cc3-next-actions{justify-content:flex-start}}@media(max-width:840px){.cc3-next-ready{grid-template-columns:repeat(2,1fr)}.cc3-diff-meta,.cc3-diff-cols,.cc3-pair{grid-template-columns:1fr}}
</style>
<script>
(function(){
'use strict';
window.CC3={preview:null,galleryIndex:0};
function e(v){return esc(v)}
function ensureReview(){if(document.getElementById('cc3Review'))return;const side=document.querySelector('#rformPreviewModal .preview-side');if(!side)return;const schedule=document.getElementById('rformPreviewSchedule');const box=document.createElement('div');box.id='cc3Review';box.className='cc3-review';box.innerHTML='<div id="cc3ReviewState" class="cc3-review-state NOT_REVIEWED">НЕ ПРОВЕРЕНО</div><div id="cc3ReviewInfo" class="sub" style="margin-top:7px"></div><button id="cc3ReviewedBtn" class="btn primary" style="width:100%;margin-top:9px">Проверено</button>';side.insertBefore(box,schedule||null)}
function ensureNext(){if(document.getElementById('cc3Next'))return;const summary=document.querySelector('.summary');if(summary)summary.insertAdjacentHTML('beforebegin','<section id="cc3Next" class="cc3-next"><div class="sub">Загрузка следующей публикации…</div></section>')}
function ensureDiff(){if(document.getElementById('cc3Diff'))return;const actions=document.querySelector('#editModal .modal-actions');if(actions)actions.insertAdjacentHTML('beforebegin','<div id="cc3Diff" class="cc3-diff"><div class="cc3-diff-head">Сравнение версии перед сохранением</div><div id="cc3DiffMeta" class="cc3-diff-meta"></div><div class="cc3-diff-cols"><div class="cc3-diff-col"><h4>БЫЛО</h4><div id="cc3DiffOld"></div></div><div class="cc3-diff-col"><h4>СТАЛО</h4><div id="cc3DiffNew"></div></div></div></div>')}
function mediaCard(v,i,total){return `<div class="preview-media"><button class="preview-media-button" onclick="cc3Lightbox(${i})"><img src="${e(v.previewUrl)}" alt="${e(v.name||'visual')}"></button><div class="preview-media-meta"><span>${i+1}/${total} · ${e(v.name||'')}</span><a class="link" href="${e(v.sourceUrl||v.previewUrl)}" target="_blank" rel="noopener">Оригинал</a></div></div>`}
window.cc3Gallery=function(i){CC3.galleryIndex=i;draw(CC3.preview,CC3.preview&&CC3.preview.forSchedule)};
window.cc3GalleryStep=function(d){const n=(CC3.preview.data.visuals||[]).length;if(!n)return;cc3Gallery((CC3.galleryIndex+d+n)%n)};
function mediaHtml(vs){if(!vs.length)return '<div class="preview-placeholder">Визуал отсутствует.</div>';if(vs.length===1)return `<div class="cc3-single">${mediaCard(vs[0],0,1)}</div>`;if(vs.length===2)return `<div class="cc3-pair">${vs.map((v,i)=>mediaCard(v,i,2)).join('')}</div>`;const i=Math.min(CC3.galleryIndex,vs.length-1);return `<div class="cc3-gallery"><div class="gallery-toolbar"><span>Карточки ${vs.length} · стрелки или миниатюры</span><span>${i+1}/${vs.length}</span></div><div class="cc3-main"><button class="cc3-arrow prev" onclick="cc3GalleryStep(-1)">‹</button>${mediaCard(vs[i],i,vs.length)}<button class="cc3-arrow next" onclick="cc3GalleryStep(1)">›</button><span class="cc3-counter">${i+1}/${vs.length}</span></div><div class="cc3-thumbs">${vs.map((v,j)=>`<button class="cc3-thumb ${j===i?'active':''}" onclick="cc3Gallery(${j})"><img src="${e(v.previewUrl)}"></button>`).join('')}</div></div>`}
window.cc3Lightbox=function(i){const vs=(CC3.preview&&CC3.preview.data.visuals)||[];if(!vs.length)return;if(typeof rformCcOpenLightbox_==='function'){rformCcOpenLightbox_(i);return}window.open(vs[i].sourceUrl||vs[i].previewUrl,'_blank','noopener')};
function outboundHtml(p){const vs=p.visuals||[],segs=(p.outbound&&p.outbound.segments)||[];if(!segs.length)return '<div class="preview-placeholder">Не удалось построить фактическую структуру Telegram.</div>';return `<div class="tg-shell"><div class="tg-head"><div class="tg-avatar">R/</div><div><b>R/Form</b><div class="sub">@r_form</div></div></div><div class="tg-post">${segs.map((s,i)=>{let m='';if(s.type==='PHOTO_CAPTION'||s.type==='PHOTO_ONLY')m=mediaHtml(vs.slice(0,1));if(s.type==='ALBUM_CAPTION'||s.type==='ALBUM_ONLY')m=mediaHtml(vs.slice(0,s.visualCount||10));const t=s.text?`<div class="tg-copy">${e(s.text).replace(/\n/g,'<br>')}</div>`:'';return `<div class="tg-segment"><div class="tg-segment-label">${e(s.label||('Сообщение '+(i+1)))}</div>${m}${t}</div>`}).join('')}<div class="tg-foot"><span>Фактическая структура autopost v0.3</span><span>${p.textLength||0} знаков</span></div></div></div>`}
function review(r){ensureReview();r=r||{state:'NOT_REVIEWED'};const s=r.state||'NOT_REVIEWED',el=document.getElementById('cc3ReviewState'),btn=document.getElementById('cc3ReviewedBtn');el.className='cc3-review-state '+s;el.textContent=s==='VERIFIED'?'ПРОВЕРЕНО':s==='LOCKED'?'ПРОВЕРЕНО · LOCKED':s==='RECHECK_REQUIRED'?'ТРЕБУЕТ ПОВТОРНОЙ ПРОВЕРКИ':'НЕ ПРОВЕРЕНО';document.getElementById('cc3ReviewInfo').textContent=r.reviewedAt?`Проверено: ${r.reviewedAt}${r.reviewedBy?' · '+r.reviewedBy:''}`:'Hash фиксирует текст, режим, порядок и версии карточек.';btn.disabled=s==='VERIFIED'||s==='LOCKED';btn.textContent=btn.disabled?'Версия проверена':'Проверено';btn.onclick=markReviewed;const sb=document.getElementById('rformPreviewScheduleBtn');if(sb&&CC3.preview&&CC3.preview.forSchedule){const ok=s==='VERIFIED'||s==='LOCKED';sb.disabled=!ok;sb.textContent=ok?'Запланировать':'Сначала нажмите «Проверено»'}}
async function markReviewed(){setLoading(true);try{const r=await api('rformCcMarkPreviewReviewedV03',{contentId:CC3.preview.id});CC3.preview.data.review=r;review(r);await renderNext()}catch(err){alert(err.message)}finally{setLoading(false)}}
function draw(state,forSchedule){const p=state.data,x=p.item||{},vs=p.visuals||[],mode=String(x.Telegram_Post_Mode||'TEXT_ONLY').toUpperCase();document.getElementById('rformPreviewId').textContent=`${x.Content_ID||''} · ${mode} · ${x.Lifecycle_State||''} · v0.3`;document.getElementById('rformTelegramPreview').innerHTML=outboundHtml(p);const src=document.getElementById('rformPreviewSource');if(x.Telegram_Visual_URL){src.href=x.Telegram_Visual_URL;src.style.display='inline-block'}else src.style.display='none';const meta=[['Lifecycle',x.Lifecycle_State||'—'],['Text',x.Text_Status||'—'],['Visual',x.Visual_Status||'—'],['Approval',x.Approval_Status||'—'],['Режим',mode],['Карточек',vs.length],['Знаков',p.textLength||0],['Publish at',x.Publish_At||'—']];document.getElementById('rformPreviewMeta').innerHTML=meta.map(([k,v])=>`<span>${e(k)}</span><span>${e(v)}</span>`).join('');document.getElementById('rformPreviewWarnings').innerHTML=(p.warnings||[]).map(w=>`<div class="preview-warn">${e(w)}</div>`).join('');document.getElementById('rformPreviewEdit').onclick=()=>{closeModal('rformPreviewModal');openEdit(x.Content_ID)};const gate=document.getElementById('rformPreviewSchedule'),btn=document.getElementById('rformPreviewScheduleBtn');gate.classList.toggle('show',forSchedule);btn.style.display=forSchedule?'inline-block':'none';if(forSchedule){const d=new Date(Date.now()+86400000);d.setMinutes(0,0,0);document.getElementById('rformPreviewAt').value=localInput(d);btn.onclick=scheduleFromPreview}review(p.review)}
window.rformCcOpenPreview=async function(id,forSchedule){setLoading(true);try{const p=await api('rformCcGetPreviewV03',{contentId:id});if(!p||!p.item)throw new Error('Preview payload is empty');CC3.preview={id:id,forSchedule:!!forSchedule,data:p};CC3.galleryIndex=0;draw(CC3.preview,!!forSchedule);openModal('rformPreviewModal')}catch(err){alert('Ошибка предпросмотра: '+err.message)}finally{setLoading(false)}};
window.openSchedule=function(id){rformCcOpenPreview(id,true)};
async function scheduleFromPreview(){const raw=document.getElementById('rformPreviewAt').value;if(!raw){alert('Укажите дату и время');return}if(!confirm('Запланировать проверенную версию '+CC3.preview.id+' на '+raw+'?'))return;setLoading(true);try{await api('rformCcScheduleV03',{contentId:CC3.preview.id,publishAt:new Date(raw).toISOString()});closeModal('rformPreviewModal');await refresh()}catch(err){alert(err.message)}finally{setLoading(false)}}
async function renderNext(){ensureNext();const root=document.getElementById('cc3Next');try{const p=await api('rformCcGetNextPublicationV03');if(!p.item){root.innerHTML='<div class="cc3-next-label">Следующая публикация</div><div class="sub" style="margin-top:6px">Активных материалов нет.</div>';return}const x=p.item,r=p.review||{state:'UNKNOWN'},title=x.Reader_Value||x.Audience_Problem||x.Content_ID,visualOk=String(x.Telegram_Post_Mode||'TEXT_ONLY')==='TEXT_ONLY'||String(x.Visual_Status||'').toUpperCase()==='APPROVED',block=x.Blocking_Issue||(!['VERIFIED','LOCKED'].includes(r.state)?'Нужно проверить финальную версию в Preview.':'');root.innerHTML=`<div class="cc3-next-grid"><div><div class="cc3-next-label">Следующая публикация</div><div class="cc3-next-title">${e(truncate(title,180))}</div><div class="cc3-next-meta"><span>${e(x.Content_ID)}</span>${stateBadge(x.Lifecycle_State)}<span>${e(x.Publish_At||x.Date||'дата не назначена')}</span><span class="cc3-review-state ${e(r.state)}">${e(r.state)}</span></div><div class="cc3-next-ready"><div><small>Text</small><b>${e(x.Text_Status||'—')}</b></div><div><small>Visual</small><b>${e(visualOk?(x.Visual_Status||'NOT_REQUIRED'):(x.Visual_Status||'NOT_READY'))}</b></div><div><small>Approval</small><b>${e(x.Approval_Status||'—')}</b></div><div><small>Preview</small><b>${e(r.state||'—')}</b></div></div>${block?`<div class="cc3-next-blocker">Блокер: ${e(truncate(block,220))}</div>`:''}</div><div class="cc3-next-actions"><button class="btn preview" onclick="rformCcOpenPreview('${e(x.Content_ID)}',false)">Предпросмотр</button><button class="btn" onclick="openEdit('${e(x.Content_ID)}')">Редактировать</button>${['DRAFT','REVIEW','PLANNED'].includes(x.Lifecycle_State)?`<button class="btn primary" onclick="approve('${e(x.Content_ID)}')">Approve</button>`:''}${x.Lifecycle_State==='APPROVED'?`<button class="btn primary" onclick="openSchedule('${e(x.Content_ID)}')">Schedule</button>`:''}</div></div>`}catch(err){root.innerHTML=`<div class="cc3-next-label">Следующая публикация</div><div class="cc3-next-blocker">Ошибка: ${e(err.message)}</div>`}}
const baseRefresh=refresh;window.refresh=async function(){await baseRefresh();await renderNext()};
const baseOpenEdit=openEdit;window.openEdit=function(id){baseOpenEdit(id);ensureDiff();const x=item(id),show=x&&['APPROVED','SCHEDULED','PUBLISHED'].includes(x.Lifecycle_State),p=document.getElementById('cc3Diff');p.classList.toggle('show',!!show);if(show){p.dataset.id=id;drawDiff();['editText','editVisual','editMode'].forEach(k=>{document.getElementById(k).oninput=drawDiff;document.getElementById(k).onchange=drawDiff})}};
window.saveEdit=async function(id,live){const payload={contentId:id,text:document.getElementById('editText').value,visualUrl:document.getElementById('editVisual').value,mode:document.getElementById('editMode').value};if(live){if(!confirm('Подтвердить изменение уже опубликованного сообщения в Telegram?'))return;payload.confirm=true}setLoading(true);try{await api(live?'rformCcEditPublished':'rformCcSaveDraftV03',payload);closeModal('editModal');await refresh()}catch(err){alert(err.message)}finally{setLoading(false)}};
function valDiff(a,b,old){a=String(a||'—');b=String(b||'—');if(a===b)return e(a);return `<span class="${old?'cc3-del':'cc3-add'}">${e(old?a:b)}</span>`}
function simpleDiff(a,b){if(a===b)return[e(a).replace(/\n/g,'<br>'),e(b).replace(/\n/g,'<br>')];let p=0;while(p<a.length&&p<b.length&&a[p]===b[p])p++;let sa=a.length-1,sb=b.length-1;while(sa>=p&&sb>=p&&a[sa]===b[sb]){sa--;sb--}return[e(a.slice(0,p))+`<span class="cc3-del">${e(a.slice(p,sa+1))}</span>`+e(a.slice(sa+1)),e(b.slice(0,p))+`<span class="cc3-add">${e(b.slice(p,sb+1))}</span>`+e(b.slice(sb+1))]}
function drawDiff(){const p=document.getElementById('cc3Diff');if(!p||!p.classList.contains('show'))return;const x=item(p.dataset.id);if(!x)return;const nt=document.getElementById('editText').value,nv=document.getElementById('editVisual').value,nm=document.getElementById('editMode').value,d=simpleDiff(String(x.Telegram_Text||''),String(nt||''));document.getElementById('cc3DiffOld').innerHTML=d[0];document.getElementById('cc3DiffNew').innerHTML=d[1];document.getElementById('cc3DiffMeta').innerHTML=`<div><b>БЫЛО</b><br>Mode: ${e(x.Telegram_Post_Mode||'TEXT_ONLY')}<br>Visual: ${valDiff(x.Telegram_Visual_URL,nv,true)}</div><div><b>СТАЛО</b><br>Mode: ${valDiff(x.Telegram_Post_Mode,nm,false)}<br>Visual: ${valDiff(x.Telegram_Visual_URL,nv,false)}</div>`}
setTimeout(()=>{ensureReview();ensureNext();ensureDiff();renderNext()},250);
})();
</script>
