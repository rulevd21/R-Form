name: Apps Script Deployment CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apps-script-production.yml'
      - '.github/workflows/apps-script-deployment-ci.yml'
      - 'scripts/apps-script/**'
      - 'tests/apps-script-deployment-guard.test.mjs'
      - 'docs/governance/APPS_SCRIPT_GITHUB_DEPLOYMENT.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/apps-script-production.yml'
      - '.github/workflows/apps-script-deployment-ci.yml'
      - 'scripts/apps-script/**'
      - 'tests/apps-script-deployment-guard.test.mjs'
      - 'docs/governance/APPS_SCRIPT_GITHUB_DEPLOYMENT.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Syntax check deployment guard
        run: node --check scripts/apps-script/guard.mjs

      - name: Syntax check bootstrap shell
        run: bash -n scripts/apps-script/bootstrap-codespace.sh

      - name: Run guard unit tests
        run: node --test tests/apps-script-deployment-guard.test.mjs
