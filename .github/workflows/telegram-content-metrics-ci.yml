name: Telegram Content Metrics CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/telegram_content_metrics_v1.gs'
      - 'tests/telegram-content-metrics-v1.test.mjs'
      - 'docs/operating-architecture/TELEGRAM_CONTENT_METRICS_V1.md'
      - '.github/workflows/telegram-content-metrics-ci.yml'
  push:
    branches: [main]
    paths:
      - 'automation/telegram_content_metrics_v1.gs'
      - 'tests/telegram-content-metrics-v1.test.mjs'
      - 'docs/operating-architecture/TELEGRAM_CONTENT_METRICS_V1.md'
      - '.github/workflows/telegram-content-metrics-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax check collector
        run: node --check < automation/telegram_content_metrics_v1.gs
      - name: Run collector contract tests
        run: node --test tests/telegram-content-metrics-v1.test.mjs
      - name: Enforce safety boundaries
        run: |
          ! grep -Eq 'sendMessage|sendPhoto|sendMediaGroup|bot[0-9]+:' automation/telegram_content_metrics_v1.gs
          grep -Fq "source: 'TELEGRAM_PUBLIC_WEB_PREVIEW'" automation/telegram_content_metrics_v1.gs
          grep -Fq "checkpointWindows" automation/telegram_content_metrics_v1.gs
          grep -Fq "shares: null" automation/telegram_content_metrics_v1.gs
