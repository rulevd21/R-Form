name: Content Control tests

on:
  push:
    branches:
      - agent/content-control-streamlit-readonly
    paths:
      - 'apps/content-control/**'
      - 'automation/content_control_api_v0_4.gs'
      - 'automation/tests/**'
      - 'automation/owner_bot_v1.gs'
      - '.github/workflows/content-control-tests.yml'
  pull_request:
    paths:
      - 'apps/content-control/**'
      - 'automation/content_control_api_v0_4.gs'
      - 'automation/tests/**'
      - 'automation/owner_bot_v1.gs'
      - '.github/workflows/content-control-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/content-control
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/content-control/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Apps Script syntax
        run: cp ../../automation/content_control_api_v0_4.gs /tmp/content_control_api_v0_4.js && node --check /tmp/content_control_api_v0_4.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test preparation-only Apps Script behavior
        run: node --test ../../automation/tests/*.test.cjs


      - name: Check Owner Bot syntax
        run: cp ../../automation/owner_bot_v1.gs /tmp/owner_bot_v1.js && node --check /tmp/owner_bot_v1.js
